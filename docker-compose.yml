version: '3.8'

services:
  github-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-scanner
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - DB_PATH=${DB_PATH:-./data/scanner.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MAX_ANALYSIS_ISSUES=${MAX_ANALYSIS_ISSUES:-50}
      - MAX_BODY_CHARS=${MAX_BODY_CHARS:-1000}
      - MAX_TOTAL_CHARS=${MAX_TOTAL_CHARS:-30000}
      - MAX_SCAN_ISSUES=${MAX_SCAN_ISSUES}
    volumes:
      # Persist database data
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
